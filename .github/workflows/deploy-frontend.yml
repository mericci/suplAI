name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'packages/shared/**'
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'packages/shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy Preview
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          DEPLOY_URL=$(vercel --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | grep -E "^https://" | tail -n 1)
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Deploy to Production
        if: github.event_name == 'push'
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n## Vercel Preview\n\n🚀 **Preview URL:** [${url}](${url})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
