name: Deploy Frontend

on:
  push:
    branches: []
    paths:
      - 'apps/frontend/**'
      - 'packages/shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (production)
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
